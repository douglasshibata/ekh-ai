version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ekh-postgres
    environment:
      POSTGRES_DB: ekh_db
      POSTGRES_USER: ekh_user
      POSTGRES_PASSWORD: ekh_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: ekh-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  opensearch:
    image: opensearchproject/opensearch:2.8.0
    container_name: ekh-opensearch
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
    ports:
      - "9200:9200"

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: ekh-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  redis:
    image: redis:7-alpine
    container_name: ekh-redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ../../backend-java
      dockerfile: Dockerfile
    container_name: ekh-backend
    depends_on:
      - postgres
      - qdrant
      - opensearch
      - rabbitmq
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ekh_db
      SPRING_AI_OPENAI_API_KEY: ${OPENAI_API_KEY}
      SPRING_AI_VECTORSTORE_QDRANT_HOST: qdrant
      SPRING_RABBITMQ_HOST: rabbitmq
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ../../frontend-angular
      dockerfile: Dockerfile
    container_name: ekh-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  qdrant_data:
